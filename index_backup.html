<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Pose Sculptor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0D0D0D;
            --text: #AAAAAA;
            --accent: #00FFFF;
            --border: rgba(170, 170, 170, 0.15);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-weight: 100;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            background: rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 48px;
            text-transform: uppercase;
            color: #fff;
        }

        .sex-toggle {
            display: flex;
            margin-bottom: 40px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .sex-btn {
            flex: 1;
            padding: 12px 0;
            background: transparent;
            color: #666;
            border: none;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .sex-btn.active {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .cat-btn {
            text-align: left;
            padding: 14px 16px;
            background: transparent;
            border: 1px solid transparent;
            color: #666;
            cursor: pointer;
            border-radius: 8px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 100%;
        }

        .cat-btn.active {
            color: var(--accent);
            background: rgba(0, 255, 255, 0.05);
        }

        .main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .grid-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }

        .category-title {
            font-size: 24px;
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
        }

        .pose-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 24px;
        }

        .pose-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pose-card.active {
            border-color: var(--accent);
            background: rgba(0, 255, 255, 0.02);
        }

        .pose-card svg {
            width: 100%;
            height: auto;
            margin-bottom: 16px;
        }

        .pose-card span {
            font-size: 10px;
            letter-spacing: 2px;
            color: #666;
        }

        .preview-area {
            width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .preview-svg-wrapper {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 2/3;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        #main-preview {
            width: 100%;
            height: 100%;
        }

        .preview-title {
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 40px;
            color: #fff;
        }

        .download-btn {
            padding: 16px 40px;
            border: 1px solid rgba(170, 170, 170, 0.3);
            border-radius: 9999px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>

        };

        let state = { sex: 'MALE', category: 'STANDING', activePoseId: null };
        function init() { renderCategories(); selectCategory('STANDING'); }
        function renderCategories() {
            const list = document.getElementById('category-list'); list.innerHTML = '';
            CATEGORIES.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat.id === state.category ? 'active' : ''}`;
                btn.textContent = cat.label; btn.onclick = () => selectCategory(cat.id);
                list.appendChild(btn);
            });
        }
        function renderGrid() {
            const grid = document.getElementById('pose-grid'); grid.innerHTML = '';
            const poses = POSES[state.sex][state.category] || [];
            poses.forEach(pose => {
                const card = document.createElement('div');
                card.className = `pose-card ${pose.id === state.activePoseId ? 'active' : ''}`;
                card.onclick = () => selectPose(pose.id);
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '40 20 120 240');
                svg.innerHTML = buildPaths(pose.paths, STROKE_WIDTH, pose.id === state.activePoseId ? "#00FFFF" : "#AAAAAA");
                const span = document.createElement('span'); span.textContent = pose.name;
                card.appendChild(svg); card.appendChild(span); grid.appendChild(card);
            });
        }
        function renderPreview() {
            const poses = POSES[state.sex][state.category] || [];
            const active = poses.find(p => p.id === state.activePoseId) || poses[0];
            if (active) {
                document.getElementById('main-preview').innerHTML = buildPaths(active.paths, STROKE_WIDTH * 1.5, "#AAAAAA");
                document.getElementById('preview-title').textContent = active.name;
            }
        }
        function buildPaths(p, sw, sc) { return p.map(d => `<path d="${d}" stroke="${sc}" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-linejoin="round" />`).join(''); }
        window.setSex = (s) => { state.sex = s; document.getElementById('btn-male').classList.toggle('active', s === 'MALE'); document.getElementById('btn-female').classList.toggle('active', s === 'FEMALE'); selectCategory(state.category); };
        function selectCategory(c) { state.category = c; document.getElementById('category-title').textContent = CATEGORIES.find(x => x.id === c).label; renderCategories(); const p = POSES[state.sex][state.category]; state.activePoseId = p && p.length > 0 ? p[0].id : null; renderGrid(); renderPreview(); }
        function selectPose(id) { state.activePoseId = id; renderGrid(); renderPreview(); }
        window.downloadSVG = () => {
            const p = POSES[state.sex][state.category].find(x => x.id === state.activePoseId); if (!p) return;
            const svg = `<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="400" height="600"><rect width="200" height="300" fill="#0D0D0D"/>${buildPaths(p.paths, STROKE_WIDTH, "#AAAAAA")}</svg>`;
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pose-${p.name}.svg`; a.click();
        };
        init();
    </script>
</body>

</html>
