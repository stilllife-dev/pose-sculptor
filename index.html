<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pose Sculptor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">Pose Sculptor</div>
        <div class="sex-toggle">
            <button class="sex-btn active" id="btn-male" onclick="setSex('MALE')">MALE</button>
            <button class="sex-btn" id="btn-female" onclick="setSex('FEMALE')">FEMALE</button>
        </div>
        <div id="category-list"></div>
    </nav>
    <main class="main-area">
        <div class="grid-area">
            <h2 class="category-title" id="category-title">Standing</h2>
            <div class="pose-grid" id="pose-grid"></div>
        </div>
        <aside class="preview-area">
            <div class="preview-svg-wrapper">
                <svg id="main-preview" viewBox="0 0 200 300"></svg>
            </div>
            <h3 class="preview-title" id="preview-title">Pose Name</h3>
            <button class="download-btn" onclick="downloadSVG()">Download SVG</button>
        </aside>
    </main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
